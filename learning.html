<main class="wrap" id="main"><h1>Resources</h1><section id="lab"><h2>Quadratic graphs</h2><p>Adjust a, b, and c to see how they change the graph of y = ax² + bx + c.</p><div class="experiment"><div class="experiment-header"><span>THE QUADRATIC PLAYGROUND</span><button id="reset" type="button">Reset <span>↺</span></button></div><div class="plot-wrap"><svg id="plot" viewBox="0 0 500 300" role="img" aria-label="Interactive quadratic graph"><defs><pattern id="lab-grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#e0e2ef" stroke-width="1"/></pattern><clipPath id="plot-clip"><rect width="500" height="300"/></clipPath></defs><rect width="500" height="300" fill="url(#lab-grid)"/><path d="M0 150H500M250 0V300" stroke="#aaadc5"/><g fill="#8288a5" font-size="11"><text x="478" y="166">x</text><text x="260" y="17">y</text><text x="255" y="165">0</text><text x="373" y="165">5</text><text x="122" y="165">−5</text></g><path id="curve" clip-path="url(#plot-clip)" fill="none" stroke="#666e9b" stroke-width="3"/><circle id="vertex" r="5" fill="#a88ab9"/></svg><output id="equation" aria-live="polite">y = x²</output></div><div class="controls"><label for="a"><span><b>a</b> / curve</span><input id="a" type="range" min="-3" max="3" step="0.1" value="1"><output id="a-value">1</output></label><label for="b"><span><b>b</b> / position</span><input id="b" type="range" min="-5" max="5" step="0.1" value="0"><output id="b-value">0</output></label><label for="c"><span><b>c</b> / height</span><input id="c" type="range" min="-5" max="5" step="0.1" value="0"><output id="c-value">0</output></label></div><p class="graph-insight" id="insight">The curve opens upward. Its turning point is (0, 0).</p></div></section><script src="script.js" defer></script></main>
